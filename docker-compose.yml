version: '3.8'

networks:
  web-network:
    external: true

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dipalearning}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Marena25012004$}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8888:8000"
    environment:
      - DEBUG=True
      - DB_NAME=${DB_NAME:-dipalearning}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Marena25012004$}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - default
      - web-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8888/api
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - default
      - web-network

volumes:
  postgres_data:
